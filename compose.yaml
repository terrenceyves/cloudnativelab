name: cloud-native-lab
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Lancer d'abord ./scripts/setup.sh}
    volumes:
      - orders-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d orders"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  orders:
    image: cloud-native-lab-orders
    build: ./services/commandes
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: orders
      PGUSER: lab
      PGPASSWORD: ${POSTGRES_PASSWORD:?Lancer d'abord ./scripts/setup.sh}
      PORT: 3000
      KAFKA_BROKERS: kafka:9092
      NOTIFICATIONS_URL: http://notifications:3001
      CATALOG_URL: http://catalog:3002
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  catalog:
    build: ./services/catalogue
    environment:
      PORT: 3002
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 20s
    restart: unless-stopped
  kafka-init:
    image: apache/kafka:4.1.2
    entrypoint: ["/bin/sh", "/init/create-topics.sh"]
    volumes:
      - ./infrastructure/kafka/create-topics.sh:/init/create-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
  outbox-relay:
    image: cloud-native-lab-orders
    build: ./services/commandes
    command: ["node", "src/outbox-relay.js"]
    environment:
      PGHOST: db
      PGDATABASE: orders
      PGUSER: lab
      PGPASSWORD: ${POSTGRES_PASSWORD:?Lancer d'abord ./scripts/setup.sh}
      KAFKA_BROKERS: kafka:9092
    depends_on:
      orders:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
  notifications-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Lancer d'abord ./scripts/setup.sh}
    volumes:
      - notifications-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications -d notifications"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  notifications:
    build: ./services/notifications
    environment:
      PGHOST: notifications-db
      PGDATABASE: notifications
      PGUSER: notifications
      PGPASSWORD: ${POSTGRES_PASSWORD:?Lancer d'abord ./scripts/setup.sh}
      KAFKA_BROKERS: kafka:9092
    depends_on:
      notifications-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
volumes:
  orders-data:
  kafka-data:
  notifications-data:
